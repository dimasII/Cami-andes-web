<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Camiñandes — COIL Apurímac · Galicia</title>
  <desc id="bannerDesc">Banner del proyecto Camiñandes: una web para leer el territorio, la memoria y la comunidad entre Apurímac (Perú) y Galicia (España).</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04150f"/>
      <stop offset="0.55" stop-color="#08251a"/>
      <stop offset="1" stop-color="#0d3a27"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.58">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bbf7d0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86efac" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#86efac" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#glow)"/>

  <!-- Curvas de nivel -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.2">
    <path d="M-60 436 C 190 356, 380 486, 620 416 S 1010 292, 1280 356 S 1510 438, 1670 384"/>
    <path d="M-60 470 C 200 394, 392 516, 646 446 S 1034 330, 1294 392 S 1520 468, 1670 420"/>
    <path d="M-60 398 C 180 322, 360 438, 600 370 S 998 252, 1264 314 S 1500 400, 1670 342"/>
    <path d="M-60 360 C 170 286, 350 396, 584 330 S 980 214, 1248 274 S 1490 360, 1670 300"/>
    <path d="M 1040 150 C 1140 60, 1320 66, 1420 140 S 1540 260, 1660 222"/>
    <path d="M 1080 120 C 1170 40, 1330 46, 1450 116 S 1560 230, 1670 194"/>
  </g>

  <!-- Montañas -->
  <path d="M0 520 V 432 L 168 338 L 300 408 L 470 288 L 640 398 L 806 326 L 980 418 L 1142 318 L 1320 408 L 1460 348 L 1600 418 V 520 Z" fill="#061f16" opacity="0.55"/>
  <path d="M0 520 V 468 L 208 398 L 380 452 L 558 368 L 740 448 L 930 388 L 1102 458 L 1282 398 L 1450 452 L 1600 418 V 520 Z" fill="#04170f" opacity="0.85"/>

  <!-- Texto principal -->
  <g>
    <text x="96" y="118" fill="#86efac" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="6">COIL 2026 · APURÍMAC ↔ GALICIA</text>

    <text x="92" y="244" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="122" letter-spacing="-2">Camiñandes</text>

    <text x="96" y="310" fill="#d1fae5" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-style="italic">Caminos que se encuentran</text>

    <text x="98" y="354" fill="#ffffff" fill-opacity="0.66" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20">Una web para leer el territorio, la memoria y la comunidad.</text>

    <line x1="96" y1="392" x2="680" y2="392" stroke="url(#route)" stroke-width="1.5"/>

    <g font-family="'Helvetica Neue', Arial, sans-serif">
      <text x="96" y="442" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="36">7</text>
      <text x="96" y="464" fill="#a7f3d0" fill-opacity="0.7" font-size="11" letter-spacing="2.4">PROVINCIAS</text>

      <text x="258" y="442" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="36">29</text>
      <text x="258" y="464" fill="#a7f3d0" fill-opacity="0.7" font-size="11" letter-spacing="2.4">LUGARES</text>

      <text x="408" y="442" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="36">4</text>
      <text x="408" y="464" fill="#a7f3d0" fill-opacity="0.7" font-size="11" letter-spacing="2.4">RUTAS</text>

      <text x="538" y="442" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="36">120</text>
      <text x="538" y="464" fill="#a7f3d0" fill-opacity="0.7" font-size="11" letter-spacing="2.4">FOTOS</text>
    </g>

    <text x="96" y="500" fill="#ffffff" fill-opacity="0.35" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.6">UN PROYECTO ENTRE DOS UNIVERSIDADES</text>
    <text x="1504" y="500" fill="#ffffff" fill-opacity="0.42" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="2.6" text-anchor="end">USC × UNAMBA</text>
  </g>

  <!-- Visual: dos orillas, un camino -->
  <g>
    <circle cx="1240" cy="252" r="196" fill="url(#sun)"/>
    <circle cx="1240" cy="252" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2"/>
    <circle cx="1240" cy="252" r="112" fill="none" stroke="#86efac" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 10"/>

    <!-- Marcas del compás -->
    <g stroke="#a7f3d0" stroke-opacity="0.4" stroke-width="1.4">
      <line x1="1240" y1="86" x2="1240" y2="96"/>
      <line x1="1240" y1="408" x2="1240" y2="418"/>
      <line x1="1074" y1="252" x2="1084" y2="252"/>
      <line x1="1396" y1="252" x2="1406" y2="252"/>
      <line x1="1123" y1="135" x2="1130" y2="142"/>
      <line x1="1350" y1="362" x2="1357" y2="369"/>
      <line x1="1123" y1="369" x2="1130" y2="362"/>
      <line x1="1350" y1="142" x2="1357" y2="135"/>
    </g>

    <!-- Arco entre las dos orillas -->
    <path d="M 1110 177 A 150 150 0 0 1 1370 327" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 9" opacity="0.85"/>

    <!-- Puntos -->
    <circle cx="1110" cy="177" r="8" fill="#86efac" opacity="0.18"/>
    <circle cx="1110" cy="177" r="4.5" fill="#86efac"/>
    <circle cx="1370" cy="327" r="8" fill="#86efac" opacity="0.18"/>
    <circle cx="1370" cy="327" r="4.5" fill="#86efac"/>

    <!-- Etiquetas -->
    <text x="1080" y="160" fill="#d1fae5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="end">APURÍMAC</text>
    <text x="1080" y="178" fill="#ffffff" fill-opacity="0.4" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2.4" text-anchor="end">PERÚ</text>

    <text x="1402" y="344" fill="#d1fae5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3">GALICIA</text>
    <text x="1402" y="362" fill="#ffffff" fill-opacity="0.4" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="2.4">ESPAÑA</text>

    <!-- Centro -->
    <text x="1240" y="286" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="138" text-anchor="middle">2</text>
    <text x="1240" y="320" fill="#a7f3d0" fill-opacity="0.8" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" letter-spacing="5" text-anchor="middle">ORILLAS</text>
    <text x="1240" y="340" fill="#ffffff" fill-opacity="0.38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" letter-spacing="3.4" text-anchor="middle">UN CAMINO</text>
  </g>

  <rect x="1" y="1" width="1598" height="518" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
